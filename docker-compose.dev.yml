# ──────────────────────────────────────────────────────────────
# Docker Compose — Development (polling mode, no nginx)
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
# This compose file exposes PostgreSQL and Redis ports to the
# host for local debugging.  The bot runs in polling mode.
# ──────────────────────────────────────────────────────────────

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: premium-bot-dev
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      WEBHOOK_ENABLED: "false"
      DEBUG: "true"
      LOGGING_LEVEL: "DEBUG"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bot-network

  postgres:
    image: postgres:15-alpine
    container_name: premium-bot-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-premium_bot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bot-network

  redis:
    image: redis:7-alpine
    container_name: premium-bot-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bot-network

volumes:
  postgres_data_dev:
  redis_data_dev:

networks:
  bot-network:
    driver: bridge
