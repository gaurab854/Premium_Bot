# ──────────────────────────────────────────────────────────────
# Nginx — SSL-terminating reverse proxy for Telegram webhooks
#
# Key features:
#   1. Listens on :443 with TLS 1.2+ (strong cipher suite)
#   2. Proxies /webhook/<bot_token> → bot:8443
#   3. IP whitelisting — ONLY Telegram's official subnets:
#        • 149.154.160.0/20
#        • 91.108.4.0/22
#   4. Redirects HTTP :80 → HTTPS :443
#   5. Security headers (HSTS, X-Frame-Options, etc.)
#
# SSL certificates:
#   Place your cert and key in ./nginx/ssl/:
#     • ssl/cert.pem      (fullchain certificate)
#     • ssl/key.pem       (private key)
#
#   For Let's Encrypt, use certbot:
#     certbot certonly --standalone -d yourdomain.com
#     cp /etc/letsencrypt/live/yourdomain.com/fullchain.pem nginx/ssl/cert.pem
#     cp /etc/letsencrypt/live/yourdomain.com/privkey.pem   nginx/ssl/key.pem
# ──────────────────────────────────────────────────────────────

# Run as non-root where possible
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ──────────────────────────────────────────────────────────
    #  Basic settings
    # ──────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # Hide Nginx version from response headers
    server_tokens off;

    # Logging
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    # ──────────────────────────────────────────────────────────
    #  Telegram IP Whitelisting
    #
    #  Telegram sends webhook requests ONLY from these subnets.
    #  Source: https://core.telegram.org/bots/webhooks
    #
    #  149.154.160.0/20  →  149.154.160.0 – 149.154.175.255
    #  91.108.4.0/22     →  91.108.4.0   – 91.108.7.255
    #
    #  We use a geo block to map IPs to allow/deny.
    #  Any IP NOT in these ranges gets a 403 Forbidden.
    # ──────────────────────────────────────────────────────────
    geo $is_telegram {
        default          0;    # deny by default

        # Telegram Bot API — official subnets
        149.154.160.0/20 1;    # Telegram subnet 1
        91.108.4.0/22    1;    # Telegram subnet 2

        # Additional Telegram subnets (IPv4, for completeness)
        91.108.8.0/22    1;    # Telegram subnet 3
        91.108.12.0/22   1;    # Telegram subnet 4
        91.108.16.0/22   1;    # Telegram subnet 5
        91.108.20.0/22   1;    # Telegram subnet 6
        149.154.160.0/22 1;    # Telegram subnet 7
        149.154.164.0/22 1;    # Telegram subnet 8
        149.154.168.0/22 1;    # Telegram subnet 9
        149.154.172.0/22 1;    # Telegram subnet 10

        # Allow localhost for health checks / debugging
        127.0.0.1/32     1;
        ::1/128          1;

        # Docker internal network (health checks from compose)
        172.28.0.0/16    1;
    }

    # ──────────────────────────────────────────────────────────
    #  Upstream — the bot container
    # ──────────────────────────────────────────────────────────
    upstream bot_backend {
        server bot:8443;

        # Keep connections alive to reduce handshake overhead
        keepalive 32;
    }

    # ──────────────────────────────────────────────────────────
    #  HTTP → HTTPS redirect  (port 80)
    # ──────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Allow ACME challenge for Let's Encrypt renewals
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ──────────────────────────────────────────────────────────
    #  HTTPS server  (port 443)
    # ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # ── SSL certificate paths ────────────────────────────
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # ── TLS hardening ────────────────────────────────────
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # OCSP stapling for faster TLS handshakes
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;

        # ── Security headers ─────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;

        # ── Request size limit (Telegram max is ~50MB for files) ─
        client_max_body_size 50M;

        # ──────────────────────────────────────────────────────
        #  Webhook endpoint
        #
        #  The URL path should contain the bot token as a secret
        #  so that random internet traffic can't trigger the bot.
        #
        #  Telegram sends POST requests to:
        #    https://yourdomain.com/webhook/<BOT_TOKEN>
        #
        #  We match ANY /webhook/ path and proxy to the bot.
        # ──────────────────────────────────────────────────────
        location /webhook/ {
            # ── IP whitelist enforcement ──────────────────────
            if ($is_telegram = 0) {
                return 403;
            }

            # ── Proxy to bot container ───────────────────────
            proxy_pass         http://bot_backend;
            proxy_http_version 1.1;

            # Forward real client IP
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # Disable buffering for real-time webhook delivery
            proxy_buffering off;
        }

        # ── Health check endpoint (no IP restriction) ────────
        location /health {
            access_log off;
            return 200 '{"status": "ok"}';
            add_header Content-Type application/json;
        }

        # ── Block everything else ────────────────────────────
        location / {
            return 444;   # Nginx drops the connection silently
        }
    }
}
